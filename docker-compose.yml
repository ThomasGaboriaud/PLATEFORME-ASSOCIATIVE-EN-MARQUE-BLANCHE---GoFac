# Services de développement : base de données et boîte de réception de test.
# Lancer avec `pnpm db:up`, arrêter avec `pnpm db:down`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gofac
      POSTGRES_PASSWORD: gofac
      POSTGRES_DB: gofac
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gofac']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Interface web

volumes:
  postgres-data:
