name: Fonctionnalité
description: Une tâche ou une fonctionnalité à développer
labels: ['feature']
body:
  - type: textarea
    id: goal
    attributes:
      label: Objectif
      description: Ce que l'utilisateur doit pouvoir faire, et pourquoi.
      placeholder: En tant que responsable d'équipe, je veux… afin de…
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tâches
      description: DB, API, web, mobile, tests, documentation.
      placeholder: |
        - [ ] DB : …
        - [ ] API : …
        - [ ] Web : …
        - [ ] Tests : …
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      placeholder: |
        - [ ] …
        - [ ] Utilisable au clavier et au lecteur d'écran
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dépendances
      description: Issues ou routes d'API dont cette tâche a besoin, ou qui l'attendent.
