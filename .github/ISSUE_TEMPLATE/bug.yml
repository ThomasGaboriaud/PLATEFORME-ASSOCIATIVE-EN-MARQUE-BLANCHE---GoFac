name: Bug
description: Signaler un comportement incorrect
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Constater que…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Partie concernée
      options: [API, Site web, Administration, Application mobile, Documentation]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Captures ou logs
      description: Sans aucune donnée personnelle ni secret.
